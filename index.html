<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oge Macerası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, özenli, oyunbaz ama sade
   IDEA: mor bir oyun konsolunun ekranı ve menüleri
   PICTURE: oyun tuvali; menüler onun üstünde cam paneller
   COLOUR and TYPE: tek mor palet, lila vurgu; Rubik
   LAYOUT: başlık, tuval, ince durum satırı */
:root{color-scheme:light;--bg:#e6f6ff;--panel:rgba(255,255,255,.9);--panel2:#f2f5fa;--line:rgba(60,80,110,.14);--line2:rgba(60,80,110,.3);--ink:#2b3445;--muted:#667085;--accent:#7F77DD;--accent2:#7F77DD;--ok:#4fae5a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:linear-gradient(180deg,#bfe7ff 0%,#e6f6ff 45%,#e9f8e1 100%);color:var(--ink);font:15px/1.5 Rubik,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
.wrap{max-width:1000px;margin:0 auto;padding:20px max(3vw,12px) 32px}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.01em}
.box{position:relative;border-radius:18px;padding:6px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 44px rgba(40,70,110,.18)}
canvas{display:block;width:100%;height:auto;border-radius:13px;background:#cdeeff}
.ov{position:absolute;inset:6px;display:grid;place-items:center;background:rgba(200,235,255,.12);border-radius:13px;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:min(580px,100%);display:grid;gap:12px;background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(236,248,255,.42));backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.55);border-radius:24px;padding:22px;box-shadow:0 10px 36px rgba(40,90,130,.16)}
.card h2{margin:0;font-size:21px;line-height:1.2;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:14px}
.head{display:flex;align-items:center;gap:10px}.back{min-height:36px;min-width:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.7)}
.lbl{font-size:13px;color:var(--muted);margin-bottom:-6px}
label{font-size:13px;color:var(--muted);display:grid;gap:6px}
input{font:16px Rubik,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.7);color:var(--ink);min-height:44px;outline:none}
input:focus{border-color:var(--accent2)}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
button{font:500 15px Rubik,sans-serif;min-height:42px;padding:9px 14px;border-radius:12px;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);transition:border-color .15s,background .15s}
button:hover{border-color:var(--line2)}
button.sel{border-color:var(--accent);background:rgba(127,119,221,.14)}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:600;color:#fff;box-shadow:0 4px 0 #534AB7}
button.primary:hover{background:#8c85e3}
button.ghost{background:transparent}
button:disabled{opacity:.35;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:14px}
.seg button{border:1px solid transparent;background:transparent;min-height:38px}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.games{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:600px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcard{display:grid;gap:2px;align-content:end;text-align:left;background-size:cover;background-position:center;padding:12px;min-height:112px;border-radius:14px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.gcard{color:#fff}.gcard b{font-size:14px;line-height:1.2;font-weight:600}.gcard span{font-size:12px;color:#eef;font-weight:400}
.gcard{position:relative;opacity:.6;transition:opacity .15s,transform .15s}.gcard:hover{opacity:.85}
.gcard.sel{opacity:1;border:3px solid var(--accent);box-shadow:0 6px 18px rgba(127,119,221,.45);transform:translateY(-2px)}
.chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;text-shadow:none}
.lvls{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.lv{padding:0;min-height:38px;font-size:14px;border-radius:8px}
.lv:disabled{background:transparent;opacity:.28}
.lv.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media(max-width:520px){.lvls{grid-template-columns:repeat(6,minmax(0,1fr))}}
.skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.skin{display:grid;justify-items:center;gap:2px;padding:8px 2px;font-size:12px;font-weight:400;color:var(--muted);border-radius:12px}
.skin.sel{color:var(--ink);font-weight:500}
.skin canvas{width:44px;height:40px;background:transparent}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.theme{font-size:12px;min-height:58px;background-size:cover;background-position:center 70%;display:flex;align-items:flex-end;justify-content:flex-start;padding:8px;border-radius:12px}
.theme span{background:rgba(255,255,255,.88);color:var(--ink);padding:1px 8px;border-radius:999px;white-space:nowrap}
@media(max-width:520px){.skins{grid-template-columns:repeat(3,minmax(0,1fr))}.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.bar b{color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#b4b9c6}.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(93,202,165,.2)}
.corner{position:absolute;top:16px;right:16px;display:flex;gap:6px}.corner[hidden]{display:none}
.corner button{min-height:36px;min-width:36px;padding:0 10px;font-size:14px;background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);color:var(--ink);display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.hcard{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(440px,86%);background:var(--panel);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:16px 20px;cursor:pointer;box-shadow:0 16px 40px rgba(40,70,110,.22)}
.hcard[hidden]{display:none}.hcard b{font-size:16px;font-weight:600}.hcard ul{margin:10px 0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink)}.hcard span{font-size:12px;color:var(--muted)}
.splash{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7% 16px 3%;border-radius:11px;pointer-events:none}
.splash[hidden]{display:none}
.stitle{font-family:'Lilita One',Rubik,sans-serif;font-size:clamp(40px,9vw,92px);line-height:1;color:#fff;letter-spacing:.01em;-webkit-text-stroke:clamp(2px,.5vw,5px) #3C3489;paint-order:stroke fill;text-shadow:0 6px 0 #26215C,0 10px 24px rgba(20,16,60,.35);transform:rotate(-3deg);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-3deg) translateY(-6px)}}
button.big{pointer-events:auto;font-size:clamp(17px,2.2vw,22px);padding:14px 40px;min-height:56px;border-radius:999px;box-shadow:0 6px 0 #3C3489,0 12px 28px rgba(20,16,60,.35);font-weight:600}
button.big:active{transform:translateY(3px);box-shadow:0 3px 0 #3C3489}
.touch{display:none;gap:8px;margin-top:12px;flex-wrap:wrap}
.touch button{flex:1 1 60px;font-size:20px;min-height:58px;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <canvas id="cv" width="960" height="600"></canvas>
    <div class="corner"><button id="homeBtn3" aria-label="Ana ekran" title="Ana ekran"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button><button id="helpBtn" aria-label="Kontroller" title="Kontroller">?</button><button id="menuBtn2" aria-label="Oyun menüsü"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menü</button></div>
    <div class="hcard" id="helpCard" hidden><b id="hcTitle"></b><ul id="hcList"></ul><span>Kapatmak için dokun</span></div>
    <div class="splash" id="splash"><div class="stitle">Oge Macerası</div><button class="primary big" id="startBtn">Oyuna başla</button></div>
    <div class="ov" id="lobby" hidden><div class="card">
      <div class="head"><button class="back" id="backBtn" aria-label="Geri" title="Geri"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2>Odaya katıl</h2></div>
      <div class="row"><label>Adın<input id="name" maxlength="16" placeholder="Mehtap"></label>
      <label>Oda kodu (ikinizde aynı)<input id="code" maxlength="10"></label></div>
      <div class="seg"><button id="r0">1. oyuncu</button><button id="r1">2. oyuncu</button></div>
      <div class="lbl">Karakterin</div><div class="skins"></div>
      <button class="primary" id="join">Odaya gir</button>
      <p id="lmsg"></p>
    </div></div>
    <div class="ov" id="menu" hidden><div class="card">
      <div class="head"><button class="back" id="menuBack" aria-label="Geri" title="Geri"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2>Ne oynayalım?</h2></div>
      <div class="games" id="games"></div>
      <p id="gdesc"></p>
      <div class="lvls" id="lvls"></div>
      <button class="primary" id="playBtn">Oyna</button>
      <p style="text-align:center;font-size:13px">Oyunu başlatan kim olursa olsun, ikinizde de aynı bölüm açılır.</p>
    </div></div>
    <div class="ov" id="msg" hidden><div class="card" style="text-align:center"><h2 id="mt"></h2><p id="mp"></p></div></div>
  </div>
  <div class="bar">
    <span class="pill"><span class="dot" id="cdot"></span><span id="conn">Bağlı değil</span></span>
    <b id="where"></b>
  </div>
  <div class="touch" id="touch"><button data-k="L">◀</button><button data-k="R">▶</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="Z">Çek</button><button data-k="X">İt</button></div>
</div>
<script>
{
// ===== ÇEKİRDEK: bölüm üretici + fizik (DOM kullanmaz) =====
const T=30,H=20,PW=20,PH=26,GRAV=0.45,JUMP=-10,SPD=3.3,LEVELS=30;
const GAMES=[
 {name:'Ayna Dünya',roles:['Üst dünya','Alt dünya'],desc:'Biriniz yukarıda, biriniz ters yerçekimli alt dünyada. Birinin bastığı düğme, öbürünün dünyasında köprü kurar ya da kapı açar.'},
 {name:'Işık ve Gölge',roles:['Fener','Gölge'],desc:'Fener sadece etrafını görür. Hayalet platformlar yalnızca fenerin ışığında katılaşır. Gölge karanlık duvarlardan geçip fenere yol açar.'},
 {name:'İple Bağlı',roles:['Kırmızı uç','Mavi uç'],desc:'İkiniz bir iple bağlısınız. Birbirinizin omzuna çıkın, biriniz ▼ ile sabitlenince öbürü ▲ ile ipe tırmansın.'},
 {name:'Mıknatıs İkizler',roles:['Artı (+)','Eksi (−)'],desc:'Z ile ortağına doğru çekilirsin, X ile ondan itilirsin. Birbirinizi duvarların üstüne fırlatın, uçurumları uçarak geçin.'},
 {name:'Ateş ve Su',roles:['Ateş','Su'],desc:'Ateş lavda, Su suda yürür; yeşil çamur ikinizi de yakar. Kendi renginizdeki elmasları toplayın, düğme ve kollarla kapıları açın, ikiniz de kendi kapınıza ulaşın.'}
];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function genLevel(gi,l){
  const d=l/(LEVELS-1),R=rng(gi*7919+l*104729+17),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const W0=600,g=[];for(let y=0;y<H;y++)g.push(new Array(W0).fill('.'));
  const lv={g:gi,l,d,grid:g,W:0,cps:[],grp:{},sws:[],spk:{},light:0,rope:0,magR:0};
  const set=(x,y,c)=>{if(y>=0&&y<H&&x>=0&&x<W0)g[y][x]=c;};
  const fill=(x0,x1,y0,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c);};
  if(gi===4)return genTemple(lv,d,R,ri,l);
  const nSeg=2+Math.floor(l/4);
  let x=6;
  if(gi===0){ // ---------- AYNA DÜNYA ----------
    fill(0,W0-1,0,0,'#');fill(0,W0-1,8,11,'#');fill(0,W0-1,19,19,'#');
    const top={play:7,spike:9,bridge:8,r0:1,r1:7},bot={play:12,spike:10,bridge:11,r0:12,r1:18};
    const seg={
      bridge(x0){const flip=R()<.5,F=flip?bot:top,O=flip?top:bot;
        const w=clamp(3+Math.round(d*4)+ri(0,1),3,8),w2=clamp(3+Math.round(d*4)+ri(0,1),3,8);
        set(x0+1,O.play,'a');
        for(let i=0;i<w;i++){set(x0+3+i,F.spike,'^');set(x0+3+i,F.bridge,'A');}
        set(x0+3+w+1,F.play,'b');
        const p2=x0+3+w+3;for(let i=0;i<w2;i++){set(p2+i,O.spike,'^');set(p2+i,O.bridge,'B');}
        return 3+w+3+w2+2;},
      gate(x0){const flip=R()<.5,F=flip?bot:top,O=flip?top:bot;
        set(x0+2,O.play,'c');fill(x0+4,x0+4,F.r0,F.r1,'C');
        set(x0+6,F.play,'d');fill(x0+8,x0+8,O.r0,O.r1,'D');
        return 11;},
      spikes(x0){const n=2+Math.floor(d*3),len=4+n*4;
        for(const wd of [top,bot]){let p=x0+2+ri(0,1);
          while(p<x0+len-2){const k=(d>.3&&R()<.5)?2:1;for(let i=0;i<k;i++)set(p+i,wd.play,'^');p+=k+ri(3,4);}
          if(d>.5){const bx=x0+ri(3,len-4);const top_=wd===top;fill(bx,bx+1,top_?5:12,top_?5:14,'#');}}
        return len;}
    };
    const kinds=['bridge','gate','spikes'];
    for(let i=0;i<nSeg;i++){lv.cps.push(x);const k=i%3===2?'spikes':(R()<.55?'bridge':'gate');x+=seg[k](x);}
    fill(x+2,x+3,5,7,'>');fill(x+2,x+3,12,14,'>');
    lv.starts=[{x:2*T+5,y:8*T-PH},{x:2*T+5,y:12*T}];
  } else {
    fill(0,W0-1,0,0,'#');fill(0,W0-1,16,19,'#');
    const pit=(x0,x1)=>{fill(x0,x1,16,17,'.');fill(x0,x1,18,18,'^');};
    if(gi===1){ // ---------- IŞIK VE GÖLGE ----------
      lv.light=(6-2.5*d)*T;
      let gid=0;
      const seg={
        bridge(x0){const w=clamp(4+Math.round(d*6)+ri(0,2),4,12);pit(x0+1,x0+w);
          const maxGap=lv.light>=4.5*T?3:2;let pos=x0+1,row=15;
          while(x0+w+1-pos>maxGap){pos+=ri(1,maxGap);if(pos>x0+w)break;
            const len=d>.6?1:ri(1,2);row=d>.4?clamp(row+ri(-1,1),13,15):15;
            for(let i=0;i<len&&pos+i<=x0+w;i++)set(pos+i,row,'~');pos+=len;}
          return w+2;},
        wall(x0){const id=gid++;for(let y=1;y<=15;y++){set(x0+3,y,'X');lv.grp[(x0+3)+','+y]=id;}
          let sx=x0+6,sy=15;
          if(d>=.35){fill(x0+6,x0+7,14,15,'#');fill(x0+8,x0+9,12,15,'#');sx=x0+9;sy=11;}
          set(sx,sy,'s');lv.grp[sx+','+sy]=id;return 12;},
        climb(x0){fill(x0+2,x0+3,13,13,'~');fill(x0+4,x0+5,10,10,'~');fill(x0+6,x0+9,9,15,'#');return 11;},
        spikes(x0){const n=2+Math.floor(d*3);let p=x0+2;for(let i=0;i<n;i++){const k=d>.3&&R()<.5?2:1;for(let j=0;j<k;j++)set(p+j,15,'^');p+=k+ri(3,4);}return p-x0+1;}
      };
      for(let i=0;i<nSeg;i++){lv.cps.push(x);const k=i%3===0?'bridge':i%3===1?'wall':(d>=.25&&R()<.6?'climb':'spikes');x+=seg[k](x);}
    } else if(gi===2){ // ---------- İPLE BAĞLI ----------
      lv.rope=(7-2*d)*T;
      const seg={
        wall(x0){fill(x0+4,x0+9,12,15,'#');return 12;},
        tower(x0){fill(x0+4,x0+13,12,15,'#');fill(x0+9,x0+13,8,11,'#');return 16;},
        pillars(x0){const w=clamp(6+Math.round(d*8),6,14);fill(x0+1,x0+w,15,15,'^');let p=x0+1+ri(1,2);
          while(p<x0+w-1){fill(p,p,13,15,'#');p+=ri(2,d>.5?4:3);}return w+2;},
        gate(x0){set(x0+3,15,'p');fill(x0+5,x0+5,1,15,'G');set(x0+7,15,'p');return 10;},
        pits(x0){const n=1+Math.floor(d*2);let p=x0+2;for(let i=0;i<n;i++){const w=ri(2,4);pit(p,p+w-1);p+=w+ri(3,4);}return p-x0+1;}
      };
      for(let i=0;i<nSeg;i++){lv.cps.push(x);let k=['wall','pillars','gate','pits'][i%4];if(k==='wall'&&d>=.3&&R()<.6)k='tower';x+=seg[k](x);}
    } else { // ---------- MIKNATIS ----------
      lv.magR=(12-4*d)*T;
      const seg={
        wall(x0){const h=clamp(5+Math.round(d*3),5,8);fill(x0+4,x0+11,16-h,15,'#');return 14;},
        pit(x0){const w=clamp(5+Math.round(d*4)+ri(0,1),5,Math.floor(lv.magR/T)-1);pit(x0+1,x0+w);if(d>.5){fill(x0+2,x0+w-1,9,9,'^');for(let i=x0+2;i<=x0+w-1;i++)lv.spk[i+',9']='d';}return w+2;},
        islands(x0){const n=2+Math.floor(d*2);let p=x0+1;const parts=[];for(let i=0;i<n;i++){const gp=ri(5,6);parts.push([p,p+gp-1]);p+=gp;const r=ri(11,14);fill(p,p+1,r,r,'#');p+=2;}
          const gp=ri(5,6);parts.push([p,p+gp-1]);p+=gp;for(const [a,b] of parts)pit(a,b);return p-x0+1;},
        spikes(x0){const n=2+Math.floor(d*3);let p=x0+2;for(let i=0;i<n;i++){const k=R()<.5?2:1;for(let j=0;j<k;j++)set(p+j,15,'^');p+=k+ri(3,4);}return p-x0+1;}
      };
      for(let i=0;i<nSeg;i++){lv.cps.push(x);let k=['wall','pit','spikes'][i%3];if(k==='spikes'&&d>=.4)k='islands';x+=seg[k](x);}
    }
    fill(x+2,x+3,13,15,'>');
    lv.starts=[{x:2*T+5,y:16*T-PH},{x:3*T+5,y:16*T-PH}];
  }
  const W=x+7;fill(x+5,W-1,0,H-1,'#');fill(0,0,0,H-1,'#');
  for(let y=0;y<H;y++)g[y].length=W;
  lv.W=W;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const c=g[y][xx];
    if(c==='^'&&!lv.spk[xx+','+y]){const below=y+1<H?g[y+1][xx]:'#',above=y>0?g[y-1][xx]:'#';lv.spk[xx+','+y]=below==='#'?'u':above==='#'?'d':'u';}
    if('abcdps'.includes(c))lv.sws.push({x:xx,y,c});}
  return lv;
}


// ---------- ATEŞ VE SU: tek ekranlı katlı tapınak ----------
function genTemple(lv,d,R,ri,l){
  const W=32,g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill('.'));
  const set=(x,y,ch)=>{if(y>=0&&y<H&&x>=0&&x<W)g[y][x]=ch;};
  const fill=(x0,x1,y0,y1,ch)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,ch);};
  fill(0,W-1,0,0,'#');fill(0,W-1,19,19,'#');fill(0,0,0,H-1,'#');fill(W-1,W-1,0,H-1,'#');
  const F=[14,9,4],B=[19,14,9];          // kat zeminleri ve her koridorun tabanı
  for(let i=0;i<3;i++){const right=i%2===0;fill(1,30,F[i],F[i],'#');
    if(right)fill(28,30,F[i],F[i],'.');else fill(1,3,F[i],F[i],'.');
    const b=B[i];                           // merdiven: alttaki koridorun boşluk tarafında
    if(right){fill(29,29,b-2,b-1,'#');fill(30,30,b-4,b-1,'#');}else{fill(2,2,b-2,b-1,'#');fill(1,1,b-4,b-1,'#');}}
  // kapılar en üst katta
  const dx=l%2?22:24;fill(dx,dx,2,3,'R');fill(dx+3,dx+3,2,3,'U');
  lv.grp={};lv.gems=[];
  const used=new Set();const free=(x0,x1,row)=>{for(let x=x0;x<=x1;x++)if(used.has(row+':'+x))return false;return true;};
  const mark=(x0,x1,row)=>{for(let x=x0;x<=x1;x++)used.add(row+':'+x);};
  // koridor ayrıntıları
  const nGate=d>=.6?2:d>=.2?1:0,gateRows=[];
  const order=[0,1,2].sort(()=>R()-.5);for(let k=0;k<nGate;k++)gateRows.push(order[k]);
  let lever=d>=.35;
  for(let i=0;i<3;i++){
    const floor=B[i],top=F[i]+1;          // koridor satırları top..floor-1
    let lo=6,hi=25;
    if(gateRows.includes(i)){const letter=gateRows.indexOf(i)===0?'c':'d';const gx=ri(13,18);
      fill(gx,gx,top,floor-1,letter.toUpperCase());set(gx-3,floor-1,letter);set(gx+3,floor-1,letter);mark(gx-4,gx+4,floor);}
    else if(lever&&i>0){lever=false;const gx=ri(12,19),side=i%2===0?-1:1;
      // kol: koridorun girişine yakın; kapı ilerde
      const lx=gx+side*5;fill(gx,gx,top,floor-1,'V');set(lx,floor-1,'v');mark(Math.min(gx,lx)-1,Math.max(gx,lx)+1,floor);}
    const n=1+Math.round(d*2.2)+(R()<d*.5?1:0);
    for(let k=0;k<n;k++){
      for(let tries=0;tries<20;tries++){
        const w=(d>.3&&R()<.5)?2:1+((R()<.25)?1:0);const x0=ri(lo,hi-w+1);
        if(!free(x0-1,x0+w,floor))continue;
        const r=R();const type=d<.12?(r<.5?'L':'W'):(r<.38?'L':r<.76?'W':'Q');
        fill(x0,x0+w-1,floor,floor,type);mark(x0-1,x0+w,floor);
        const gt=type==='L'?'r':type==='W'?'u':(R()<.5?'r':'u');
        set(x0+(w>1?1:0),floor-2,gt);break;}
    }
    // ek elmaslar
    const extra=1+Math.round(d);for(let k=0;k<extra;k++){const x=ri(7,24);if(g[floor-1][x]==='.'&&g[floor-2][x]==='.')set(x,floor-2-(R()<.5?1:0),R()<.5?'r':'u');}
  }
  // üst kat elmasları
  set(10,2,'r');set(14,2,'u');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=g[y][x];if('cdv'.includes(ch))lv.sws.push({x,y,c:ch});if(ch==='r'||ch==='u')lv.gems.push({x,y,t:ch});}
  lv.grid=g;lv.W=W;lv.starts=[{x:2*T+5,y:19*T-PH},{x:4*T+5,y:19*T-PH}];lv.cps=[];lv.temple=1;
  return lv;
}

// ---------- fizik ----------
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const prect=p=>({x:p.x,y:p.y,w:PW,h:PH});
function tileSolid(lv,st,tx,ty,role){
  if(ty<0||ty>=H)return null;
  if(tx<0||tx>=lv.W)return{x:tx*T,y:ty*T,w:T,h:T};
  const c=lv.grid[ty][tx],full={x:tx*T,y:ty*T,w:T,h:T};
  switch(c){
    case '#':return full;
    case 'A':case 'B':return st.sw[c.toLowerCase()]?{...full,dyn:1}:null;
    case 'C':case 'D':return st.sw[c.toLowerCase()]?null:{...full,dyn:1};
    case 'G':return st.sw.p?null:{...full,dyn:1};
    case 'X':return (role===1||st.op.has(lv.grp[tx+','+ty]))?null:{...full,dyn:1};
    case '~':return st.lit(tx,ty)?{x:tx*T,y:ty*T,w:T,h:10,one:1,dyn:1}:null;
    case 'L':case 'W':case 'Q':return{x:tx*T,y:ty*T+10,w:T,h:T-10};
    case 'V':return st.op.has('v')?null:{...full,dyn:1};
  }
  return null;
}
function solidsAround(lv,st,p,role,extra){
  const out=[],x0=Math.floor(p.x/T)-2,x1=Math.floor((p.x+PW)/T)+2,y0=Math.floor(p.y/T)-2,y1=Math.floor((p.y+PH)/T)+2;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const r=tileSolid(lv,st,x,y,role);if(r)out.push(r);}
  if(extra)out.push(extra);
  const me=prect(p);return out.filter(r=>!(r.dyn&&!r.one&&ov(me,r)));
}
function moveBody(p,mx,my,gd,sol){
  let ground=false;
  p.x+=mx;for(const r of sol){if(r.one)continue;if(ov(prect(p),r)){if(mx>0)p.x=r.x-PW;else if(mx<0)p.x=r.x+r.w;}}
  const prevB=p.y+PH-my,prevT=p.y-my;
  p.y+=my;
  for(const r of sol){if(!ov(prect(p),r))continue;
    if(r.one){ if(gd>0&&my>=0&&prevB<=r.y+0.5){p.y=r.y-PH;ground=true;p.vy=0;p.onPeer=!!r.peer;} continue;}
    if(my>0){p.y=r.y-PH;if(gd>0)ground=true;}else if(my<0){p.y=r.y+r.h;if(gd<0)ground=true;}
    p.vy=0;}
  return ground;
}
function mkPlayer(lv,role){const s=lv.starts[role];return{x:s.x,y:s.y,vx:0,vy:0,ground:false,coy:0,buf:0,held:false,face:1,dead:0,cp:0,an:false,mg:0,ex:false,onPeer:false};}
function respawn(lv,p,role,cp){
  const s=lv.starts[role];p.cp=Math.max(p.cp,cp);const cx=p.cp>0?lv.cps[p.cp]:null;
  p.x=cx!=null?cx*T+5:s.x;p.y=s.y;p.vx=p.vy=0;p.dead=0;
}
// ctx: {lv,st,role,peer:{cx,cy,rx,ry,dx,an,dead,cp}|null}
function stepPlayer(p,inp,ctx){
  const {lv,st,role,peer}=ctx,gi=lv.g;
  if(p.dead>0){p.dead--;if(p.dead===0)respawn(lv,p,role,peer?peer.cp:0);return;}
  const gd=(gi===0&&role===1)?-1:1;
  let grav=GRAV,magOn=false;
  const pcx=p.x+PW/2,pcy=p.y+PH/2;
  let dx=0,dy=0,dist=1e9;
  const live=peer&&!peer.dead;
  if(live){dx=peer.cx-pcx;dy=peer.cy-pcy;dist=Math.hypot(dx,dy)||1;}
  p.an=gi===2&&inp.D&&p.ground;
  const dir=(inp.R?1:0)-(inp.L?1:0);if(dir)p.face=dir;
  const tv=p.an?0:dir*SPD;
  p.mg=gi===3?(inp.Z?1:inp.X?-1:0):0;
  let ax=0,ay=0;
  if(p.mg&&live&&dist<lv.magR&&dist>22){ax=p.mg*dx/dist*0.8;ay=p.mg*dy/dist*0.8;grav=0.25;magOn=true;}
  if(p.ground&&!magOn)p.vx=tv;else p.vx+=(tv-p.vx)*(magOn?0.05:0.25);
  p.vx=clamp(p.vx+ax,-9,9);p.vy+=ay;
  if(inp.U&&!p.held)p.buf=7;p.held=inp.U;if(p.buf>0)p.buf--;
  if(p.ground)p.coy=6;else if(p.coy>0)p.coy--;
  if(p.buf>0&&p.coy>0&&!p.an){p.vy=JUMP*gd;p.buf=0;p.coy=0;p.ground=false;}
  let climbing=false;
  if(gi===2&&live&&peer.an&&inp.U&&!p.ground&&dist>36){p.vx=dx/dist*3.2;p.vy=dy/dist*3.2;climbing=true;}
  if(!climbing){if(!inp.U&&p.vy*gd<-4)p.vy+=0.5*gd;p.vy=clamp(p.vy+grav*gd,-11,11);}
  let plat=null;
  if((gi===2||gi===3)&&live)plat={x:peer.rx,y:peer.ry,w:PW,h:6,one:1,peer:1};
  p.onPeer=false;
  p.ground=moveBody(p,p.vx,p.vy,gd,solidsAround(lv,st,p,role,plat));
  if(p.onPeer&&live&&peer.dx)moveBody(p,peer.dx,0,gd,solidsAround(lv,st,p,role,null));
  if(gi===2&&live){const cx=p.x+PW/2,cy=p.y+PH/2,ex=cx-peer.cx,ey=cy-peer.cy,dd=Math.hypot(ex,ey);
    if(dd>lv.rope){const w=peer.an?1:(p.an?0:0.5);if(w){const ux=ex/dd,uy=ey/dd,e=(dd-lv.rope)*w;
      const g2=moveBody(p,-ux*e,-uy*e,gd,solidsAround(lv,st,p,role,null));p.ground=p.ground||g2;
      const vr=p.vx*ux+p.vy*uy;if(vr>0){p.vx-=vr*ux;p.vy-=vr*uy;}}}}
  // tehlikeler
  const me=prect(p),x0=Math.floor(p.x/T)-1,x1=Math.floor((p.x+PW)/T)+1,y0=Math.floor(p.y/T)-1,y1=Math.floor((p.y+PH)/T)+1;
  p.ex=false;
  for(let y=Math.max(0,y0);y<=Math.min(H-1,y1);y++)for(let x=Math.max(0,x0);x<=Math.min(lv.W-1,x1);x++){
    const c=lv.grid[y][x];
    if(c==='^'){const o=lv.spk[x+','+y];const r=o==='d'?{x:x*T+5,y:y*T,w:20,h:16}:{x:x*T+5,y:y*T+14,w:20,h:16};if(ov(me,r)){p.dead=45;return;}}
    if(c==='>'&&ov(me,{x:x*T,y:y*T,w:T,h:T}))p.ex=true;
    if((c==='L'||c==='W'||c==='Q')&&ov({x:p.x+3,y:p.y+PH,w:PW-6,h:4},{x:x*T,y:y*T+10,w:T,h:T-10})){if(c==='Q'||(c==='L'&&role===1)||(c==='W'&&role===0)){p.dead=45;return;}}
    if((c==='r'&&role===0||c==='u'&&role===1)&&st.got&&ov(me,{x:x*T+7,y:y*T+7,w:16,h:16}))st.got.add(x+','+y);
    if((c==='R'&&role===0||c==='U'&&role===1)&&ov(me,{x:x*T+4,y:y*T,w:22,h:T}))p.ex=true;
  }
  if(p.y>H*T+40||p.y<-60){p.dead=45;return;}
  for(let i=lv.cps.length-1;i>p.cp;i--)if(p.x>lv.cps[i]*T+T){p.cp=i;break;}
}
function computeSwitches(lv,st,bodies){
  st.sw={};
  for(const s of lv.sws){const r={x:s.x*T+3,y:s.y*T+(s.y>=12&&lv.g===0?0:18),w:24,h:12};
    for(const b of bodies){if(!b||b.dead)continue;if(ov(prect(b),r)){
      if(s.c==='s'){if(b.role===1)st.op.add(lv.grp[s.x+','+s.y]);}else if(s.c==='v')st.op.add('v');else st.sw[s.c]=true;}}}
}

async function peerRoom(code){
  await loadPeerJs();
  const hostId='ikili-oyunlar-'+code.toLowerCase();
  let conn=null,cb=null;
  const attach=c=>{conn=c;c.on('data',d=>{if(cb&&d&&typeof d==='object')cb([{presence:d}]);});c.on('close',()=>{if(conn===c){conn=null;if(cb)cb([]);}});};
  const api={presence(s){if(conn&&conn.open){try{conn.send(s);}catch(e){}}},onPeers(f){cb=f;}};
  return new Promise((res,rej)=>{
    const host=new Peer(hostId);peerObjs.push(host);let settled=false;
    host.on('open',()=>{settled=true;host.on('connection',c=>{if(conn)try{conn.close();}catch(e){}attach(c);});res(api);});
    host.on('error',err=>{
      if(err&&err.type==='unavailable-id'){ // oda zaten açık: misafir olarak bağlan
        try{host.destroy();}catch(e){}
        const guest=new Peer();peerObjs.push(guest);
        const connect=()=>{const c=guest.connect(hostId);c.on('open',()=>attach(c));c.on('close',()=>setTimeout(()=>{if(!conn)connect();},1500));};
        guest.on('open',()=>{connect();res(api);});
        guest.on('error',e=>{if(!settled){settled=true;rej(e);}});
      } else if(!settled){settled=true;rej(err);}
    });
  });
}

  if(c==='r'||c==='u'){if(st.got&&st.got.has(x+','+y))return;const cx0=X+15,cy0=Y+15+Math.sin(t*3+x)*3,col=c==='r'?['#ff4d4d','#ffb0b0']:['#2f9bff','#b5e0ff'];
    cx.fillStyle=col[0];cx.beginPath();cx.moveTo(cx0,cy0-10);cx.lineTo(cx0+8,cy0-2);cx.lineTo(cx0,cy0+10);cx.lineTo(cx0-8,cy0-2);cx.closePath();cx.fill();
    cx.fillStyle=col[1];cx.beginPath();cx.moveTo(cx0,cy0-10);cx.lineTo(cx0+4,cy0-2);cx.lineTo(cx0-4,cy0-2);cx.closePath();cx.fill();return;}
  if(c==='R'||c==='U'){if(lv.grid[y-1]&&lv.grid[y-1][x]===c)return;const col=c==='R'?'#E24B4A':'#378ADD';
    cx.fillStyle='#6b4a2e';cx.fillRect(X-4,Y-2,T+8,2*T+2);cx.fillStyle='#3a2716';cx.beginPath();cx.moveTo(X,Y+2*T);cx.lineTo(X,Y+10);cx.arc(X+15,Y+10,15,Math.PI,0);cx.lineTo(X+T,Y+2*T);cx.fill();
    cx.strokeStyle=col;cx.lineWidth=3;cx.stroke();cx.fillStyle=col;cx.globalAlpha=.6+.3*Math.sin(t*3);
    if(c==='R'){cx.beginPath();cx.moveTo(X+15,Y+16);cx.quadraticCurveTo(X+24,Y+30,X+15,Y+38);cx.quadraticCurveTo(X+6,Y+30,X+15,Y+16);cx.fill();}
    else{cx.beginPath();cx.moveTo(X+15,Y+16);cx.quadraticCurveTo(X+24,Y+32,X+15,Y+38);cx.quadraticCurveTo(X+6,Y+32,X+15,Y+16);cx.fill();cx.fillStyle='#fff';cx.fillRect(X+12,Y+28,3,5);}
    cx.globalAlpha=1;return;}
  if(c==='V'){if(st.op.has('v'))return;cx.fillStyle='#FAC775';cx.fillRect(X+6,Y,18,T);cx.fillStyle='#00000030';cx.fillRect(X+13,Y,4,T);return;}
  if(c==='v'){const on=st.op.has('v');cx.fillStyle='#6b6b7a';cx.fillRect(X+5,Y+T-6,20,6);cx.strokeStyle='#FAC775';cx.lineWidth=4;cx.lineCap='round';

  if('abcdps'.includes(c)){

    const pressed=c==='s'?st.op.has(lv.grp[x+','+y]):c==='p'?st.sw.p:st.sw[c];
    const down=cur.g===0&&y>=12;
    cx.fillStyle='#00000060';cx.fillRect(X+2,down?Y:Y+T-4,26,4);
    cx.fillStyle=col;const h=pressed?2:6;cx.fillRect(X+5,down?Y+4:Y+T-4-h,20,h);return;}
  if(c==='~'){const lit=st.lit(x,y);const show=lit||myRole===1;if(!show)return;
    cx.globalAlpha=lit?1:.3;cx.fillStyle=lit?'#fff3b0':'#b9a4ff';cx.fillRect(X,Y,T,10);cx.globalAlpha=1;return;}
  if(c==='>'){cx.fillStyle='#ffffff18';cx.fillRect(X,Y,T,T);cx.fillStyle='#fff';cx.globalAlpha=.4+.3*Math.sin(t*3+y);cx.fillRect(X+12,Y+8,6,14);cx.globalAlpha=1;}
}
function drawDark(camX){

function drawSkin(c,k,f,t,rot){
  const S=SKINS[k]||SKINS[0],R=13;rot=rot||0;f=f||1;
  c.save();c.translate(0,-R);
  if(S.kind==='planet'){c.strokeStyle='#CECBF6';c.lineWidth=3;c.beginPath();c.ellipse(0,0,21,6,-0.35,Math.PI,2*Math.PI);c.stroke();}
  c.save();c.beginPath();c.arc(0,0,R,0,7);c.clip();
  const spin=S.kind==='spin'?t*18:rot;c.rotate(spin);
  const L=(w,col)=>{c.strokeStyle=col;c.lineWidth=w;};
  switch(S.kind){
    case 'basket':c.fillStyle=S.col;c.fillRect(-R,-R,2*R,2*R);L(1.6,'#5a2a0e');c.beginPath();c.moveTo(-R,0);c.lineTo(R,0);c.moveTo(0,-R);c.lineTo(0,R);c.stroke();
      c.beginPath();c.arc(-R*1.25,0,R*.95,-1,1);c.stroke();c.beginPath();c.arc(R*1.25,0,R*.95,Math.PI-1,Math.PI+1);c.stroke();break;
    case 'soccer':c.fillStyle='#fff';c.fillRect(-R,-R,2*R,2*R);c.fillStyle='#26215C';
      const pent=(x,y,r,a)=>{c.beginPath();for(let i=0;i<5;i++){const q=a+i*1.2566;c.lineTo(x+Math.cos(q)*r,y+Math.sin(q)*r);}c.closePath();c.fill();};
      pent(0,0,4.6,-Math.PI/2);for(let i=0;i<5;i++){const q=-Math.PI/2+i*1.2566;pent(Math.cos(q)*11,Math.sin(q)*11,4.2,q+Math.PI/5);}
      L(1,'#26215C');for(let i=0;i<5;i++){const q=-Math.PI/2+i*1.2566;c.beginPath();c.moveTo(Math.cos(q)*4.6,Math.sin(q)*4.6);c.lineTo(Math.cos(q)*7.5,Math.sin(q)*7.5);c.stroke();}break;
    case 'red':c.fillStyle=S.col;c.fillRect(-R,-R,2*R,2*R);c.fillStyle='#fff';c.fillRect(-R,-2.5,2*R,5);c.fillStyle='#A32D2D';c.fillRect(-R,-4,2*R,1.4);c.fillRect(-R,2.6,2*R,1.4);break;
    case 'blue':c.fillStyle=S.col;c.fillRect(-R,-R,2*R,2*R);c.fillStyle='#fff';c.beginPath();for(let i=0;i<10;i++){const q=-Math.PI/2+i*Math.PI/5,r=i%2?2.8:6.5;c.lineTo(Math.cos(q)*r,Math.sin(q)*r);}c.closePath();c.fill();break;
    case 'spin':{const g=c.createRadialGradient(-3,-3,1,0,0,R);g.addColorStop(0,'#fff');g.addColorStop(1,'#7d8aa3');c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
      c.fillStyle='#E24B4A';for(let i=0;i<4;i++){c.save();c.rotate(i*Math.PI/2);c.beginPath();c.moveTo(4,-3);c.lineTo(R,-6);c.lineTo(R-1,2);c.closePath();c.fill();c.restore();}
      c.fillStyle='#378ADD';c.beginPath();c.arc(0,0,5,0,7);c.fill();c.fillStyle='#FAC775';c.beginPath();c.arc(0,0,2,0,7);c.fill();break;}
    case 'tennis':c.fillStyle=S.col;c.fillRect(-R,-R,2*R,2*R);L(1.8,'#fff');c.beginPath();c.arc(-R*1.15,0,R*.85,-1.2,1.2);c.stroke();c.beginPath();c.arc(R*1.15,0,R*.85,Math.PI-1.2,Math.PI+1.2);c.stroke();break;
    case 'beach':{const cols=['#E24B4A','#FAC775','#378ADD','#fff','#5DCAA5','#fff'];for(let i=0;i<6;i++){c.fillStyle=cols[i];c.beginPath();c.moveTo(0,0);c.arc(0,0,R+1,i*Math.PI/3,(i+1)*Math.PI/3);c.closePath();c.fill();}
      c.fillStyle='#fff';c.beginPath();c.arc(0,0,3,0,7);c.fill();break;}
    case 'bowling':{const g=c.createRadialGradient(-4,-5,1,0,0,R);g.addColorStop(0,'#8f86ea');g.addColorStop(1,'#26215C');c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
      c.fillStyle='#120f2e';c.beginPath();c.arc(-3,-6,1.8,0,7);c.arc(3,-6,1.8,0,7);c.arc(0,-1.5,2.2,0,7);c.fill();break;}
    case 'disco':c.fillStyle='#c9ccd8';c.fillRect(-R,-R,2*R,2*R);for(let y=-R;y<R;y+=4.5)for(let x=-R;x<R;x+=4.5){const v=((x*7+y*13)|0)%5;c.fillStyle=['#eef0f6','#b9bdcc','#dfe3ee','#fff','#a9aec0'][Math.abs(v)];c.fillRect(x+.4,y+.4,3.7,3.7);}
      c.fillStyle='#fff';const sp=.5+.5*Math.sin(t*5);c.globalAlpha*=sp;c.beginPath();c.moveTo(-6,-9);c.lineTo(-5,-6);c.lineTo(-2,-5);c.lineTo(-5,-4);c.lineTo(-6,-1);c.lineTo(-7,-4);c.lineTo(-10,-5);c.lineTo(-7,-6);c.fill();break;
    case 'planet':c.fillStyle=S.col;c.fillRect(-R,-R,2*R,2*R);c.fillStyle='#D85A30';c.fillRect(-R,-5,2*R,3);c.fillRect(-R,4,2*R,2);c.fillStyle='#F5C4B3';c.beginPath();c.arc(5,-7,2,0,7);c.arc(-6,7,1.5,0,7);c.fill();break;
  }
  c.restore();

  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-4.5,-6,4,2.4,-0.6,0,7);c.fill();
  c.strokeStyle='rgba(30,30,50,.35)';c.lineWidth=1;c.beginPath();c.arc(0,0,R,0,7);c.stroke();
  if(S.kind==='planet'){c.strokeStyle='#CECBF6';c.lineWidth=3;c.beginPath();c.ellipse(0,0,21,6,-0.35,0,Math.PI);c.stroke();}
  // gözler
  const ex=f*2.5;c.fillStyle='#fff';c.beginPath();c.ellipse(ex-4,-1,3.2,3.8,0,0,7);c.ellipse(ex+4,-1,3.2,3.8,0,0,7);c.fill();
  c.fillStyle='#1d1a33';c.beginPath();c.arc(ex-4+f*1,-0.5,1.8,0,7);c.arc(ex+4+f*1,-0.5,1.8,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(ex-4.5+f,-1.6,.6,0,7);c.arc(ex+3.5+f,-1.6,.6,0,7);c.fill();
  c.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function drawDecor(th,camX,t,cx=window.__cx){
  const p=camX*0.4,W=960;
  if(th.decor==='meadow'){
    cx.fillStyle='rgba(255,236,150,.5)';cx.beginPath();cx.arc(820,100,62,0,7);cx.fill();cx.fillStyle='#FFE27A';cx.beginPath();cx.arc(820,100,42,0,7);cx.fill();
    cx.fillStyle='#fff';for(let i=0;i<5;i++){const x0=((i*260-p*0.3+t*12)%(W+240)+W+240)%(W+240)-120,y0=60+(i%3)*45;cloud(cx,x0,y0,1);}
    const base=cur&&cur.g===0?8*T:16*T,q=p*0.5;
    cx.fillStyle='#b5e39a';cx.beginPath();cx.moveTo(0,base);for(let x=0;x<=W;x+=30)cx.lineTo(x,base-110-Math.sin((x+q*0.5)/160)*40);cx.lineTo(W,base);cx.fill();
    cx.fillStyle='#93d17a';cx.beginPath();cx.moveTo(0,base);for(let x=0;x<=W;x+=30)cx.lineTo(x,base-50-Math.sin((x+q)/120+2)*26);cx.lineTo(W,base);cx.fill();
    for(let i=-1;i<6;i++){const tx=i*220-(q%220)+80,ty=base-30,ts=.7+(i*37%3)*.15;
      cx.fillStyle='#8a6440';cx.fillRect(tx-5*ts,ty-34*ts,10*ts,40*ts);
      cx.fillStyle='#5fb257';cx.beginPath();cx.arc(tx,ty-52*ts,30*ts,0,7);cx.arc(tx-20*ts,ty-38*ts,20*ts,0,7);cx.arc(tx+20*ts,ty-38*ts,20*ts,0,7);cx.fill();}
  } else if(th.decor==='cave'){
    cx.fillStyle='#534AB7';for(let i=-1;i<6;i++){const bx=i*200-(p%200);cx.beginPath();cx.moveTo(bx,0);cx.lineTo(bx+36,0);cx.lineTo(bx+18,40);cx.closePath();cx.moveTo(bx+90,0);cx.lineTo(bx+116,0);cx.lineTo(bx+103,26);cx.closePath();cx.fill();}
    cx.globalAlpha=.28;
    for(let i=-1;i<7;i++){const bx=i*170-(p*1.3%170)+40,by=120+((i*53)%4+4)%4*70;
      cx.fillStyle=i%2?'#CECBF6':'#AFA9EC';cx.beginPath();cx.moveTo(bx,by-26);cx.lineTo(bx+12,by-8);cx.lineTo(bx+12,by+14);cx.lineTo(bx,by+26);cx.lineTo(bx-12,by+14);cx.lineTo(bx-12,by-8);cx.closePath();cx.fill();
      cx.beginPath();cx.moveTo(bx+22,by+4);cx.lineTo(bx+29,by+14);cx.lineTo(bx+29,by+26);cx.lineTo(bx+22,by+34);cx.lineTo(bx+15,by+26);cx.lineTo(bx+15,by+14);cx.closePath();cx.fill();}
    cx.globalAlpha=1;
  } else if(th.decor==='galaxy'){
    cx.fillStyle='#CECBF6';cx.beginPath();cx.arc(800-p*0.2%960,70,30,0,7);cx.fill();cx.fillStyle=th.bg[0];cx.beginPath();cx.arc(812-p*0.2%960,62,26,0,7);cx.fill();
    cx.fillStyle='#EEEDFE';for(let i=0;i<60;i++){const sx=((i*173.3-p*0.6)%W+W)%W,sy=(i*97.7)%560;cx.globalAlpha=.4+.4*Math.sin(t*2+i);cx.fillRect(sx,sy,2,2);}cx.globalAlpha=1;
  } else {
    cx.fillStyle='#EEEDFE';for(let i=-1;i<6;i++){const bx=i*260-(p%260)+40,by=50+(i*37%3)*40;cloud(cx,bx,by,.85);}
  }
}
function drawChar(p,role,name,th,t,skin){
  const S=SKINS[skin]||SKINS[0],col=S.col,X=p.x+PW/2,inv=cur.g===0&&role===1;
  cx.save();if(p.dead)cx.globalAlpha=.3;
  cx.translate(X,inv?p.y:p.y+PH);if(inv)cx.scale(1,-1);
  cx.fillStyle='#00000040';cx.beginPath();cx.ellipse(0,0,11,3,0,0,7);cx.fill();
  if(cur.g===1&&role===0){const gl=cx.createRadialGradient(0,-13,2,0,-13,30);gl.addColorStop(0,'#fff6c0aa');gl.addColorStop(1,'#fff6c000');cx.fillStyle=gl;cx.fillRect(-30,-45,60,60);}
  drawSkin(cx,skin,p.face||1,t,(p.x||0)/13);
  if(cur.g===3){cx.fillStyle='#fff';cx.strokeStyle='#26215C';cx.lineWidth=3;cx.font='800 14px Rubik,sans-serif';cx.textAlign='center';cx.strokeText(role===0?'+':'−',0,-50);cx.fillText(role===0?'+':'−',0,-50);
    if(p.mg){cx.strokeStyle=p.mg>0?'#ffe066':'#ff7ae0';cx.lineWidth=2;cx.beginPath();cx.arc(0,-13,18+Math.sin(t*20)*2,0,7);cx.stroke();}}
  if(cur.g===2&&p.an){cx.fillStyle='#e8d6a8';cx.fillRect(-12,-2,24,4);}
  if(cur.g===4){if(role===0){for(let i=0;i<3;i++){const fx=-6+i*6,h=7+Math.sin(t*12+i*2)*3;cx.fillStyle=i===1?'#ffd23f':'#ff7a2b';cx.beginPath();cx.moveTo(fx-3.5,-25);cx.lineTo(fx,-25-h);cx.lineTo(fx+3.5,-25);cx.fill();}}
    else{cx.fillStyle='#4fb6ff';cx.beginPath();cx.moveTo(0,-38);cx.quadraticCurveTo(7,-28,0,-25);cx.quadraticCurveTo(-7,-28,0,-38);cx.fill();}
    cx.strokeStyle=role===0?'#ff6a2b':'#2f9bff';cx.lineWidth=2.5;cx.beginPath();cx.arc(0,-13,15,0,7);cx.stroke();}
  cx.restore();

}

const prevCache={};
function themePreview(i){
  if(prevCache[i])return prevCache[i];
  const th=THEMES[i],c=document.createElement('canvas');c.width=480;c.height=200;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,200);bg.addColorStop(0,th.bg[0]);bg.addColorStop(1,th.bg[1]);g.fillStyle=bg;g.fillRect(0,0,480,200);
  g.save();g.scale(0.5,0.5);drawDecor(th,0,0.3,g);g.restore();
  for(let x=0;x<16;x++)for(let y=0;y<2;y++){g.fillStyle=(x+y)%2?th.tile:th.tile2;g.fillRect(x*30,150+y*30,30,30);}
  g.fillStyle=th.edge;g.fillRect(0,150,480,3);
  return prevCache[i]=c.toDataURL();
}
function renderPickers(){
  document.querySelectorAll('.skins').forEach(box=>{
    box.innerHTML=SKINS.map((s,i)=>`<button class="skin${i===mySkin?' sel':''}" data-k="${i}" aria-label="${s.name}" title="${s.name}"><canvas width="56" height="50"></canvas></button>`).join('');
    box.querySelectorAll('.skin').forEach(b=>{const k=+b.dataset.k,c=b.querySelector('canvas').getContext('2d');c.translate(28,42);c.scale(1.35,1.35);drawSkin(c,k,1,0,0);
      b.onclick=()=>{mySkin=k;save('cl_skin',k);renderPickers();};});
  });
  document.querySelectorAll('.themes').forEach(box=>{
    box.innerHTML=THEMES.map((th,i)=>`<button class="theme${i===myTheme?' sel':''}" data-t="${i}" style="background-image:url(${themePreview(i)})"><span>${th.name}</span></button>`).join('');
    box.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{myTheme=+b.dataset.t;save('cl_theme',myTheme);renderPickers();});
  });
}
renderPickers();
requestAnimationFrame(frame);
